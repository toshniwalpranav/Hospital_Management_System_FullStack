# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - CarePulse

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          NEXT_PUBLIC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_ENDPOINT }}
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_DATABASE_ID }}
          NEXT_PUBLIC_PATIENT_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_PATIENT_COLLECTION_ID }}
          NEXT_PUBLIC_DOCTOR_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_DOCTOR_COLLECTION_ID }}
          NEXT_PUBLIC_APPOINTMENT_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPOINTMENT_COLLECTION_ID }}
          NEXT_PUBLIC_BUCKET_ID: ${{ secrets.NEXT_PUBLIC_BUCKET_ID }}
          NEXT_PUBLIC_ADMIN_PASSKEY: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSKEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_765D0C81C37D4D0F9798A8FCB288E8FF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_32EA63AB05A741339C7C8F356F6F1FE1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F9D6CF89B5184B3C9DE481BCFB4D7E08 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CarePulse'
          slot-name: 'Production'
          package: .